name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-sdlc:
    name: SDLC & Second Brain Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Agent Skills
        run: python3 scripts/validate_skills.py

      - name: Validate Second Brain Links
        run: python3 scripts/validate_brain.py

  test-and-lint:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8

      - name: Lint Code
        run: |
          flake8 scripts/ --max-line-length=120 --ignore=E501,W503

      - name: Run Test Suite (if tests exist)
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests 2>/dev/null)" ]; then
            pytest tests/ -v
          else
            echo "No tests directory yet (Stage 1 Requirements stage). Skipping pytest."
          fi
